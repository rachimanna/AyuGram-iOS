# XcodeGen spec — generate the Xcode project with:  xcodegen generate
# https://github.com/yonaskolb/XcodeGen
name: AyuGram

options:
  bundleIdPrefix: com.ayugram.port
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  TDLibKit:
    url: https://github.com/Swiftgram/TDLibKit
    # tag 1.5.2-tdlib-1.8.67-0efabf93 (TDLib 1.8.67). The code was written against this exact API.
    revision: b03132690b427a0bc54fd15307cdd22c7e4b4445
  # libopus / libogg (BSD) as XCFrameworks — decoding Telegram voice notes (Ogg/Opus).
  YbridOpus:
    url: https://github.com/vector-im/opus-swift
    exactVersion: 0.8.4
  YbridOgg:
    url: https://github.com/vector-im/ogg-swift
    exactVersion: 0.8.3

targets:
  AyuGram:
    type: application
    platform: iOS
    sources:
      - path: AyuGram
    dependencies:
      - package: TDLibKit
        product: TDLibKit
      - package: YbridOpus
        product: YbridOpus
      - package: YbridOgg
        product: YbridOgg
      - sdk: libsqlite3.tbd
    info:
      path: AyuGram/Info.plist
      properties:
        CFBundleDisplayName: AyuGram
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ru]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.ayugram.port.refresh
        # Saved Attachments (deleted media) are visible in the Files app, like Downloads/AyuGram on Android
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSPhotoLibraryUsageDescription: AyuGram needs access to your photos to send them in chats.
        NSPhotoLibraryAddUsageDescription: AyuGram saves photos and videos to your library when you ask it to.
        NSCameraUsageDescription: AyuGram uses the camera to take photos and videos for chats.
        NSMicrophoneUsageDescription: AyuGram uses the microphone to record voice messages.
        NSFaceIDUsageDescription: AyuGram can use Face ID to lock the app.
        # Telegram API credentials. Filled from Config/Secrets.xcconfig (not committed).
        # If empty, the app asks for them on first launch.
        TGApiId: $(TG_API_ID)
        TGApiHash: $(TG_API_HASH)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AYU_BUNDLE_ID)
        PRODUCT_NAME: AyuGram
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(AYU_DEVELOPMENT_TEAM)
        INFOPLIST_KEY_UILaunchScreen_Generation: YES

  AyuGramTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AyuGramTests
    dependencies:
      - target: AyuGram
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AYU_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/AyuGram.app/AyuGram
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  AyuGram:
    build:
      targets:
        AyuGram: all
        AyuGramTests: [test]
    test:
      targets:
        - AyuGramTests
